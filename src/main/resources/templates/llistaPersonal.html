<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Llista</title>
</head>
<body>

<nav>

    <ul class="eines">

        <li>
            <a href="http://localhost:8080/crearCanvas">
                    <span>
                        Dibuixar
                    </span>
            </a>
        </li>

        <li>
            <a href="http://localhost:8080/llistaPersonal">
                    <span>
                        Veure els meus dibuixos
                    </span>
            </a>
        </li>

        <li>
            <a href="http://localhost:8080/llistaPublica">
                    <span>
                        Veure tots els dibuixos
                    </span>
            </a>
        </li>

        <li>
            <a href="http://localhost:8080/login">
                    <span>
                        Fer login
                    </span>
            </a>
        </li>
    </ul>

</nav>

<ul>
    <li th:each="dibuix : ${dibuixos}">
        <a th:href="@{/dibuixos/{id}/editar(id=${dibuix.id})}"
           th:text="${dibuix.nom}"></a>

        <span th:text="|${#lists.size(dibuix.figures)} figures|"></span>

        <span th:text="|Creat: ${#temporals.format(dibuix.dataCreacio, 'dd/MM/yyyy HH:mm')}|"></span>

        <span th:text="|Modificat: ${#temporals.format(dibuix.dataModificacio, 'dd/MM/yyyy HH:mm')}|"></span>
    </li>
</ul>

</body>
</html>
