<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .canvasIselector {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 16px;
        }

        #canvasDibuix {
            display: block;
            flex-shrink: 0;
        }

        .scrollableAreaContainer {
            position: relative;
            width: 240px;
            flex-shrink: 0;
            border: 1px solid #aaa;
        }

        .scrollableItemsContainer {
            position: absolute;
            inset: 0;
            overflow-y: auto;
        }

        .scrollableItems {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0;
            padding: 12px;
            list-style: none;
        }

        .scrollableItems li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

<a th:href="@{/llistaPersonal}">Tornar als meus dibuixos</a>
<a th:href="@{/llistaPublica}">Veure tots els dibuixos</a>
<a th:href="@{/crearCanvas}">Crear un nou dibuix</a>


<h1 th:text="${dibuix.nom}"></h1>

<section class="container">

    <div class="canvasIselector">
        <canvas id="canvasDibuix"
                th:attr="width=${dibuix.amplada},height=${dibuix.alcada}"
                style="border: 1px solid;">
        </canvas>

        <div class="scrollableAreaContainer">
            <div class="scrollableItemsContainer">
                <ul id="llistaFigures" class="scrollableItems"></ul>
            </div>
        </div>
    </div>


<div class="tool-bar">
    <h1>Draw</h1>
    <label for="color-set">Color-Set</label>
    <input id="color-set" name="color-set" type="color">

    <label for="modo-de-dibujo">Elige que dibujar:</label>
    <select id="modo-de-dibujo" name="modo-de-dibujo">
        <option value="">-- Selecciona tu modo de dibujo --</option>
        <option value="seleccionar">Seleccionar figura</option>
        <option value="alzada">A mano alzada</option>
        <option value="cercle">Circulo</option>
        <option value="cuadrado">Cuadrado</option>
        <option value="triangulo">Triangulo</option>
        <option value="estrella7">Estrella de 7 puntas</option>    
    </select>

    <label for="rellenado">Quieres que tu figura sea rellenada de color tu figura?</label>
    <select name="rellenado" id="rellenado">
                <option value="no-rellenado">-- Selecciona si o no --</option>
                <option value="si-rellenado">Si</option>
                <option value="no-rellenado">No</option>
    </select>

    <label for="mida">Tria una mida: </label>

    <input type="number" id="mida" name="mida" min="1" max="100" value="25">
</div>

</section>


<script id="drawingData" type="application/json" th:inline="javascript">
    /*[[${dibuix.figures}]]*/ []
</script>

<form id="guardarDibuix"
      th:action="@{/dibuixos/{id}/guardar(id=${dibuix.id})}"
      method="post">
    <input type="hidden" id="drawing" name="drawing" value="[]">
    <button type="submit">Guardar</button>

    <label for="mostrar">Mostrar a la llista publica?</label>

    <select id="mostrar" name="mostrar">
        <option value="false" th:selected="${!dibuix.mostrar}">No</option>
        <option value="true" th:selected="${dibuix.mostrar}">Si</option>
    </select>
</form>



    
</body>

<script th:src="@{/js/editor.js}" defer></script>
</html>
