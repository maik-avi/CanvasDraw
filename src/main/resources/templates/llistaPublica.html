<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Llista Publica</title>
</head>
<body>

<nav>

    <ul class="eines">

        <li>
            <a href="http://localhost:8080/crearCanvas">
                    <span>
                        Dibuixar
                    </span>
            </a>
        </li>

        <li>
            <a href="http://localhost:8080/llistaPersonal">
                    <span>
                        Veure els meus dibuixos
                    </span>
            </a>
        </li>

        <li>
            <a href="http://localhost:8080/llistaPublica">
                    <span>
                        Veure tots els dibuixos
                    </span>
            </a>
        </li>

        <li>
            <a href="http://localhost:8080/login">
                    <span>
                        Fer login
                    </span>
            </a>
        </li>

        <li>
            <form th:action="@{/logout}" method="post">
                <button type="submit">Tancar sessió</button>
            </form>
        </li>
    </ul>

</nav>

<ul>
    <li th:each="fila : ${dibuixosPublics}">
        <a th:href="@{/dibuixos/{id}/veureDibuix(id=${fila.dibuix.id})}">
            <strong th:text="${fila.dibuix.nom}"></strong>
        </a>

        <span th:text="| — ${fila.nomUsuari}|"></span>
        <span th:text="|${#lists.size(fila.dibuix.figures)} figures|"></span>
        <span th:text="|Creat: ${#temporals.format(fila.dibuix.dataCreacio, 'dd/MM/yyyy HH:mm')}|"></span>
        <span th:text="|Modificat: ${#temporals.format(fila.dibuix.dataModificacio, 'dd/MM/yyyy HH:mm')}|"></span>
    </li>
</ul>

</body>
</html>
