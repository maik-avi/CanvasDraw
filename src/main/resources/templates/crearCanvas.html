<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dibuixar Geomtria</title>
</head>
<body>

    <nav>

        <ul class="eines">

            <li>
                <a href="http://localhost:8080/crearCanvas">
                    <span>
                        Dibuixar
                    </span>
                </a>
            </li>

            <li>
                <a href="http://localhost:8080/llistaPersonal">
                    <span>
                        Veure els meus dibuixos
                    </span>
                </a>
            </li>

            <li>
                <a href="http://localhost:8080/llistaPublica">
                    <span>
                        Veure tots els dibuixos
                    </span>
                </a>
            </li>

            <li>
                <a href="http://localhost:8080/login">
                    <span>
                        Fer login
                    </span>
                </a>
            </li>
        </ul>

    </nav>

    <form th:action="@{/crearCanvas}"
          th:object="${canvasForm}"
          method="post">

        <label for="nom">Nom del dibuix</label>
        <input type="text" th:field="*{nom}">

        <label for="amplada">Amplada</label>
        <input type="number" min="1" th:field="*{amplada}">
        <p th:errors="*{amplada}"></p>

        <label for="alcada">Alçada</label>
        <input type="number" min="1" th:field="*{alcada}">
        <p th:errors="*{alcada}"></p>

        <button type="submit">Crear Canvas</button>
    </form>


</body>
</html>
